<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="gradient" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
  <stop stop-color="#0F172A"/>
  <stop offset="1" stop-color="#1E40AF"/>
</linearGradient>


<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow
    dx="0"
    dy="12"
    stdDeviation="20"
    flood-color="#3B82F6"
    flood-opacity="0.25"
  />
</filter>

</defs>


<!-- Fundo -->

<rect
width="512"
height="512"
rx="128"
fill="url(#gradient)"
filter="url(#shadow)"
/>


<!-- Glow interno -->

<circle
cx="256"
cy="256"
